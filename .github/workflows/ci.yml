name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # Git Bash on Windows, so ./gradlew runs the same way on every runner.
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: JVM tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The desktop app ships for these three. The JDBC SQLite driver loads a native library per OS.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :composeApp:jvmTest
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ matrix.os }}
          path: composeApp/build/reports/tests/jvmTest/

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # Also checks that kotlin-js-store/wasm/yarn.lock matches the npm dependencies.
      - run: ./gradlew :composeApp:wasmJsBrowserDistribution
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: composeApp/build/dist/wasmJs/productionExecutable/
